<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
/>
    <link rel="stylesheet" href="./style.css/global.css" />
    <title>E-commerce</title>
  </head>
  <body>
    <div class="navbar">
      <div class="header-inner-content">
        <h1 class="logo">BLUE <span>STORE</span></h1>

        <nav>
          <ul>
            <li><a>Home</a></li>
            <li><a>Products</a></li>
            <li><a>Sobre</a></li>
            <li><a>Contact</a></li>
            <li><a>Conta</a></li>
          </ul>
        </nav>

        <div class="nav-icons-container">
          <img src="./assets/cart.png" alt="cart" />
          <img src="./assets/menu.png" class="menu-button" alt="menu" />
        </div>

      </div>
    </div>
    <header>
      <div class="header-inner-content">
        <div class="header-button-side">
          <div class="header-button-side-left">
            <h2>De Um Novo Estilo a Seu Trabalho</h2>
            <p>
              Açao, foque em fazer sempre o maximo, mas sim fazer no mímino 1%
              TODO DIA! CONSTÂNCIA MÍNIMA SEMPRE
            </p>
            <button>Ver Agora &#8594;</button>
          </div>

          <div class="header-button-side-right">
            <img src="./assets/gaming-msi-header.png" alt="header-image" />
          </div>
        </div>
      </div>
    </header>

    <!-- main content -->

  <main>
    <div class="gray-background">
      <div class="page-inner-content">
        <div class="coluns coluns-3">
          <img src="/assets/products/product-1.png" alt="Product 1">
          <img src="/assets/products/product-2.png" alt="Product 2">
          <img src="/assets/products/product-3.png" alt="Product 3">
        </div>
      </div>
    </div>

   
      <div>
        <div class="page-inner-content">

          <h3 class="section-title">Produtos Selecionados</h3>

          <div class="subtitle-underline"></div>
          <div class="coluns coluns-4">
            <div>
              <img src="/assets/products/product-4.png" alt="">
              <p class="product-name">Combo Gamer Meetion</p>
              <p class="rate">&#9733;&#9733;&#9733;&#9733;&#9734; </p>
            </div>
          </div>
        </div>
      </div>
  </main>


    <script>
      const navbar = document.querySelector(".navbar");
      const menuButton = document.querySelector(".menu-button");

      menuButton.addEventListener("click", () => {
        navbar.classList.toggle("show-menu");
      });
    </script>
  </body>
</html>
